<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hatch Log — Hickey Ranch</title>
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="db.js"></script><script src="utils.js"></script>
<script>renderNav();</script>

<div class="page">
  <div class="page-header">
    <h1>🐣 Hatch Log</h1>
    <p>Record every incubation batch — one entry per hatch</p>
  </div>

  <div class="kpi-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="kpi-accent"></div><div class="kpi-label">Live Birds</div><div class="kpi-val" id="k-live">—</div><div class="kpi-sub">total flock</div></div>
    <div class="kpi g"><div class="kpi-accent"></div><div class="kpi-label">Batches</div><div class="kpi-val" id="k-batches">—</div></div>
    <div class="kpi"><div class="kpi-accent"></div><div class="kpi-label">Avg Hatch Rate</div><div class="kpi-val" id="k-rate">—</div></div>
    <div class="kpi b"><div class="kpi-accent"></div><div class="kpi-label">Total Eggs Set</div><div class="kpi-val" id="k-set">—</div></div>
  </div>

  <div class="g21 anim-1">
    <div class="card">
      <div class="card-hd"><div><div class="card-title">Hatch Rate by Batch</div><div class="card-sub">% of eggs set that hatched successfully</div></div></div>
      <div class="chart-wrap" style="height:200px"><canvas id="chart-hatch"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="card-title">Log New Batch</div></div>
      <div class="form-grid">
        <div class="fg"><label>Hatch Date *</label><input type="date" id="hatch_date"></div>
        <div class="fg"><label>Breed / Source</label><input type="text" id="breed" placeholder="e.g. Coturnix"></div>
        <div class="fg"><label>Eggs Set</label><input type="number" id="eggs_set" min="0" placeholder="0"></div>
        <div class="fg"><label>Hatched</label><input type="number" id="hatched" min="0" placeholder="0"></div>
        <div class="fg"><label>Dead on Arrival</label><input type="number" id="doa" min="0" value="0"></div>
        <div class="fg"><label>Culled</label><input type="number" id="culled" min="0" value="0"></div>
        <div class="fg full"><label>Notes</label><textarea id="notes" placeholder="Incubation conditions, observations..."></textarea></div>
      </div>
      <div class="form-foot">
        <button class="btn btn-gold" id="save-btn" onclick="saveBatch()">Save Batch</button>
        <span class="form-hint" id="hint"></span>
      </div>
    </div>
  </div>

  <div class="card gap anim-2">
    <div class="card-hd"><div class="card-title">All Batches</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Date</th><th>Breed</th><th>Set</th><th>Hatched</th><th>DOA</th><th>Culled</th><th>Live</th><th>Rate</th><th>Notes</th></tr></thead>
      <tbody id="tbl"></tbody>
    </table></div>
  </div>
</div>

<script>
chartDefaults();
document.getElementById('hatch_date').value = today();
['eggs_set','hatched','doa','culled'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
  const s=+document.getElementById('eggs_set').value||0, h=+document.getElementById('hatched').value||0,
        d=+document.getElementById('doa').value||0, c=+document.getElementById('culled').value||0;
  document.getElementById('hint').textContent = s ? `→ ${h-d-c} live · ${Math.round(h/s*100)}% hatch rate` : '';
}));

async function saveBatch() {
  const btn=document.getElementById('save-btn'), dt=document.getElementById('hatch_date').value;
  if(!dt) return showToast('Please enter a hatch date','error');
  btn.disabled=true; btn.textContent='Saving...';
  const {error}=await db.from('hatch_batches').insert({
    hatch_date:dt, breed:document.getElementById('breed').value||null,
    eggs_set:+document.getElementById('eggs_set').value||null,
    hatched:+document.getElementById('hatched').value||0,
    doa:+document.getElementById('doa').value||0, culled:+document.getElementById('culled').value||0,
    notes:document.getElementById('notes').value||null,
  });
  btn.disabled=false; btn.textContent='Save Batch';
  if(error) return showToast('Error: '+error.message,'error');
  showToast('Batch saved!');
  ['breed','eggs_set','hatched','notes'].forEach(id=>document.getElementById(id).value='');
  ['doa','culled'].forEach(id=>document.getElementById(id).value='0');
  document.getElementById('hatch_date').value=today();
  document.getElementById('hint').textContent='';
  loadAll();
}

let chartInst;
async function loadAll() {
  const {data,error}=await db.from('hatch_batches').select('*').order('hatch_date',{ascending:false});
  if(error){document.getElementById('tbl').innerHTML=`<tr><td colspan="10"><div class="empty"><p>Error: ${error.message}</p></div></td></tr>`;return;}
  if(!data?.length){
    ['k-live','k-batches','k-set'].forEach(id=>document.getElementById(id).textContent='0');
    document.getElementById('k-rate').textContent='—';
    document.getElementById('tbl').innerHTML=`<tr><td colspan="10"><div class="empty"><div class="empty-ico">🐣</div><p>No batches yet — log your first hatch above!</p></div></td></tr>`;
    return;
  }
  const live=data.reduce((s,r)=>s+(r.hatched||0)-(r.doa||0)-(r.culled||0),0);
  const totalSet=data.reduce((s,r)=>s+(r.eggs_set||0),0);
  const totalHat=data.reduce((s,r)=>s+(r.hatched||0),0);
  document.getElementById('k-live').textContent=live;
  document.getElementById('k-batches').textContent=data.length;
  document.getElementById('k-set').textContent=totalSet;
  document.getElementById('k-rate').textContent=totalSet?Math.round(totalHat/totalSet*100)+'%':'—';

  const last10=[...data].reverse().slice(-10);
  if(chartInst) chartInst.destroy();
  chartInst=new Chart(document.getElementById('chart-hatch'),{
    type:'bar',
    data:{
      labels:last10.map(r=>fmtDateShort(r.hatch_date)),
      datasets:[{
        label:'Hatch Rate %',
        data:last10.map(r=>r.eggs_set?Math.round((r.hatched||0)/r.eggs_set*100):0),
        backgroundColor:last10.map(r=>{const rt=r.eggs_set?Math.round((r.hatched||0)/r.eggs_set*100):0;return rt>=70?'rgba(52,211,153,0.5)':rt>=50?'rgba(212,168,71,0.5)':'rgba(248,113,113,0.5)';}),
        borderColor:last10.map(r=>{const rt=r.eggs_set?Math.round((r.hatched||0)/r.eggs_set*100):0;return rt>=70?'#34d399':rt>=50?'#d4a847':'#f87171';}),
        borderWidth:1.5,borderRadius:5,borderSkipped:false,
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#161b20',borderColor:'rgba(255,255,255,0.08)',borderWidth:1,bodyColor:'#e8e2d9',padding:10,cornerRadius:6}},
      scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{size:10},color:'#4a4642'}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{font:{size:10},color:'#4a4642'},max:100}}}
  });

  document.getElementById('tbl').innerHTML=data.map((r,i)=>{
    const lv=(r.hatched||0)-(r.doa||0)-(r.culled||0),rt=r.eggs_set?Math.round((r.hatched||0)/r.eggs_set*100):0;
    return `<tr><td class="dim">${data.length-i}</td><td>${fmtDate(r.hatch_date)}</td><td class="dim">${r.breed||'—'}</td><td class="dim">${r.eggs_set||'—'}</td><td>${r.hatched||0}</td><td class="dim">${r.doa||0}</td><td class="dim">${r.culled||0}</td><td class="num">${lv}</td><td><span class="badge ${rt>=70?'bg':rt>=50?'ba':'br'}">${rt}%</span></td><td class="dim" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.notes||'—'}</td></tr>`;
  }).join('');
}
loadAll();
</script>
</body>
</html>
