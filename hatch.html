<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatch Log — Hickey Ranch</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script>renderNav();</script>

<div class="page">
  <div class="page-header">
    <h1>🐣 Hatch Log</h1>
    <p>Record every incubation batch — one row per hatch date</p>
  </div>

  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="kpi-label">Total Live Birds</div><div class="kpi-value" id="k-live">—</div></div>
    <div class="kpi green"><div class="kpi-label">Total Batches</div><div class="kpi-value" id="k-batches">—</div></div>
    <div class="kpi"><div class="kpi-label">Avg Hatch Rate</div><div class="kpi-value" id="k-rate">—</div></div>
    <div class="kpi blue"><div class="kpi-label">Eggs Set Total</div><div class="kpi-value" id="k-set">—</div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Log New Batch</div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Hatch Date *</label>
        <input type="date" id="hatch_date">
      </div>
      <div class="form-group">
        <label>Breed / Source</label>
        <input type="text" id="breed" placeholder="e.g. Coturnix">
      </div>
      <div class="form-group">
        <label>Eggs Set</label>
        <input type="number" id="eggs_set" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>Hatched</label>
        <input type="number" id="hatched" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label>Dead on Arrival</label>
        <input type="number" id="doa" min="0" value="0">
      </div>
      <div class="form-group">
        <label>Culled</label>
        <input type="number" id="culled" min="0" value="0">
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea id="notes" placeholder="Incubation conditions, observations..."></textarea>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-primary" id="save-btn" onclick="saveBatch()">Save Batch</button>
      <span class="form-hint" id="calc-hint"></span>
    </div>
  </div>

  <div class="card gap-top">
    <div class="card-header">
      <div class="card-title">All Batches</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Date</th><th>Breed</th><th>Set</th><th>Hatched</th><th>DOA</th><th>Culled</th><th>Live Chicks</th><th>Rate</th><th>Notes</th></tr>
        </thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
document.getElementById('hatch_date').value = today();

function calcPreview() {
  const set = +document.getElementById('eggs_set').value || 0;
  const hatched = +document.getElementById('hatched').value || 0;
  const doa = +document.getElementById('doa').value || 0;
  const culled = +document.getElementById('culled').value || 0;
  const live = hatched - doa - culled;
  const rate = set ? Math.round(hatched / set * 100) : 0;
  document.getElementById('calc-hint').textContent =
    set ? `→ ${live} live chicks · ${rate}% hatch rate` : '';
}
['eggs_set','hatched','doa','culled'].forEach(id =>
  document.getElementById(id).addEventListener('input', calcPreview)
);

async function saveBatch() {
  const btn = document.getElementById('save-btn');
  const hatch_date = document.getElementById('hatch_date').value;
  if (!hatch_date) return showToast('Please enter a hatch date', 'error');

  btn.disabled = true;
  btn.textContent = 'Saving...';

  const { error } = await db.from('hatch_batches').insert({
    hatch_date,
    breed:    document.getElementById('breed').value || null,
    eggs_set: +document.getElementById('eggs_set').value || null,
    hatched:  +document.getElementById('hatched').value || 0,
    doa:      +document.getElementById('doa').value || 0,
    culled:   +document.getElementById('culled').value || 0,
    notes:    document.getElementById('notes').value || null,
  });

  btn.disabled = false;
  btn.textContent = 'Save Batch';

  if (error) return showToast('Error: ' + error.message, 'error');
  showToast('Batch saved successfully!');
  ['eggs_set','hatched','notes','breed'].forEach(id => document.getElementById(id).value = '');
  ['doa','culled'].forEach(id => document.getElementById(id).value = '0');
  document.getElementById('hatch_date').value = today();
  document.getElementById('calc-hint').textContent = '';
  loadTable();
}

async function loadTable() {
  const { data, error } = await db.from('hatch_batches').select('*').order('hatch_date', { ascending: false });

  if (error) {
    document.getElementById('tbl').innerHTML = `<tr><td colspan="10"><div class="empty"><div class="empty-icon">⚠️</div><p>Could not load data: ${error.message}</p></div></td></tr>`;
    return;
  }
  if (!data?.length) {
    document.getElementById('tbl').innerHTML = `<tr><td colspan="10"><div class="empty"><div class="empty-icon">🐣</div><p>No batches yet — log your first hatch above!</p></div></td></tr>`;
    document.getElementById('k-live').textContent = 0;
    document.getElementById('k-batches').textContent = 0;
    document.getElementById('k-rate').textContent = '—';
    document.getElementById('k-set').textContent = 0;
    return;
  }

  const totalLive = data.reduce((s,r) => s+(r.hatched||0)-(r.doa||0)-(r.culled||0), 0);
  const totalSet  = data.reduce((s,r) => s+(r.eggs_set||0), 0);
  const totalHat  = data.reduce((s,r) => s+(r.hatched||0), 0);
  const avgRate   = totalSet ? Math.round(totalHat/totalSet*100) : 0;
  document.getElementById('k-live').textContent    = totalLive;
  document.getElementById('k-batches').textContent = data.length;
  document.getElementById('k-rate').textContent    = avgRate + '%';
  document.getElementById('k-set').textContent     = totalSet;

  document.getElementById('tbl').innerHTML = data.map((r, i) => {
    const live = (r.hatched||0) - (r.doa||0) - (r.culled||0);
    const rate = r.eggs_set ? Math.round((r.hatched||0)/r.eggs_set*100) : 0;
    return `<tr>
      <td class="muted">${data.length - i}</td>
      <td>${fmtDate(r.hatch_date)}</td>
      <td class="muted">${r.breed||'—'}</td>
      <td class="muted">${r.eggs_set||'—'}</td>
      <td>${r.hatched||0}</td>
      <td class="muted">${r.doa||0}</td>
      <td class="muted">${r.culled||0}</td>
      <td><strong>${live}</strong></td>
      <td><span class="badge ${rate>=70?'badge-green':rate>=50?'badge-amber':'badge-red'}">${rate}%</span></td>
      <td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.notes||'—'}</td>
    </tr>`;
  }).join('');
}

loadTable();
</script>
</body>
</html>
